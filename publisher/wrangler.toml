name = "ruang-tulis-publisher"
main = "worker.mjs"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
SITE_URL = "https://andikapramudyadika.github.io/Ruang-Tulis/"
GITHUB_REPOSITORY = "andikapramudyadika/Ruang-Tulis"
GITHUB_BRANCH = "main"
ALLOWED_GITHUB_ID = "124312344"

# Replace the namespace ID after running: wrangler kv namespace create SESSIONS
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Add using wrangler secret put, never in this file:
# GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, SESSION_SECRET (32+ random characters)
